<style>
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box; }
[hidden] { display: none !important; }
:root {
  /* layout: one-screen night stadium. scoreboard strip on top, full-bleed 3D catcher-view canvas, thumb-reach controls at the bottom */
  --bg: #0a1815;
  --panel: #10231f;
  --line: #27423b;
  --chalk: #eef0e4;
  --dim: #8da79b;
  --clay: #d9683b;
  --lamp: #f4c95a;
  --good: #5fd08a;
  --f-disp: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', sans-serif;
  --f-body: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', sans-serif;
  --f-num: 'DM Mono', ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--chalk);
  font: 400 14px/1.4 var(--f-body);
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
  overflow: hidden;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#app { height: 100%; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }

.board {
  display: grid; grid-template-columns: auto 1fr auto auto; gap: 14px; align-items: center;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px;
}
.inn { font: 400 22px/1 var(--f-disp); min-width: 2.2em; }
.cnt { display: grid; gap: 2px; justify-self: center; }
.cnt div { display: flex; align-items: center; gap: 6px; }
.cnt em { font: 500 11px var(--f-num); font-style: normal; color: var(--dim); width: 1ch; }
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: #1b322c; border: 1px solid var(--line); box-sizing: border-box; }
#db i.on { background: var(--good); border-color: var(--good); }
#ds i.on { background: var(--lamp); border-color: var(--lamp); }
#do i.on { background: var(--clay); border-color: var(--clay); }
#dia rect { fill: #1b322c; stroke: var(--line); stroke-width: 1; }
#dia rect.on { fill: var(--lamp); stroke: var(--lamp); }
.score { text-align: right; line-height: 1.1; }
.score small { display: block; font-size: 11px; color: var(--dim); }
.score b { font: 500 26px/1 var(--f-num); font-variant-numeric: tabular-nums; }

#stage { position: relative; flex: 1; min-height: 0; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: #07120f; }
canvas { display: block; width: 100%; height: 100%; }
#banner { position: absolute; left: 0; right: 0; top: 36%; text-align: center; pointer-events: none; opacity: 0; padding: 0 12px; }
#banner .t { font: 400 clamp(32px, 10.5vw, 54px)/1.1 var(--f-disp); text-shadow: 0 3px 0 rgba(0, 0, 0, .55); text-wrap: balance; }
#banner .s { margin-top: 8px; font: 500 13px var(--f-num); color: var(--chalk); text-shadow: 0 1px 0 rgba(0, 0, 0, .6); }
#banner.g .t { color: var(--lamp); }
#banner.n .t { color: var(--chalk); }
#banner.b .t { color: var(--clay); }
#banner.show { animation: pop 1.5s ease-out forwards; }
@keyframes pop { 0% { opacity: 0; transform: scale(.7); } 12% { opacity: 1; transform: scale(1.08); } 24% { transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; } }
#spd { position: absolute; top: 48px; right: 12px; font: 500 13px var(--f-num); color: var(--chalk); background: rgba(6, 14, 12, .6); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; pointer-events: none; }
#spd:empty { display: none; }
#hint { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; font-size: 12px; color: var(--chalk); text-shadow: 0 1px 2px rgba(0,0,0,.8); pointer-events: none; padding: 0 12px; }

#overlay { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 14px; text-align: center; background: rgba(6, 14, 12, .78); padding: 24px; }
#overlay h1 { font: 400 clamp(30px, 9vw, 44px)/1.1 var(--f-disp); margin: 0; color: var(--lamp); text-wrap: balance; }
#overlay p { margin: 0; max-width: 30ch; color: var(--chalk); }
#overlay[hidden] { display: none; }
#ospk { font: 700 13px var(--f-body); color: #fff; background: var(--clay); border-radius: 999px; padding: 4px 12px; }
#ospk:empty { display: none; }
#overlay.dlg { place-content: end center; padding-bottom: 36px; background: linear-gradient(rgba(6, 14, 12, .15), rgba(6, 14, 12, .9) 55%); }
#overlay.dlg #od { font-size: 17px; line-height: 1.6; max-width: 24ch; }
#obtns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.go2 { font: 700 15px var(--f-body); background: rgba(6, 14, 12, .5); border: 1px solid var(--line); border-radius: 10px; padding: 12px 20px; min-height: 48px; color: var(--chalk); }
.go2.menu { width: 100%; min-height: 44px; padding: 8px; }
.acts { display: flex; gap: 6px; min-height: 44px; }
.acts.idle { visibility: hidden; }
.acts[hidden] { display: none; }
.chip { flex: 1 1 0; min-width: 0; font: 700 14px var(--f-body); color: var(--lamp); background: var(--panel); border: 1px solid var(--lamp); border-radius: 10px; min-height: 44px; padding: 6px 4px; }
.chip.on { background: var(--lamp); color: #1a1406; }
#goal { position: absolute; top: 10px; left: 12px; max-width: calc(100% - 112px); font: 700 11.5px/1.4 var(--f-body); color: var(--chalk); background: rgba(6, 14, 12, .6); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; pointer-events: none; }
#goal:empty { display: none; }
#goal .hot { color: var(--lamp); }
#spd.hot { color: #ff9a5a; border-color: #ff9a5a; }
button { font-family: var(--f-body); color: var(--chalk); cursor: pointer; }
button:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
.go { font: 400 18px var(--f-disp); background: var(--clay); border: 0; border-radius: 10px; padding: 14px 28px; min-height: 48px; color: #fff; }

.ctl { display: flex; flex-direction: column; gap: 8px; }
.pitches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; }
.pitches[hidden] { display: none; }
.pitches .pg { color: var(--chalk);  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; min-height: 40px; font-size: 11px; font-weight: 700; padding: 3px 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-width: 0; }
.pitches .pg b { font-weight: 700; white-space: nowrap; }
.pitches .pg i { font: 700 15px/1.1 var(--f-num); font-style: normal; color: var(--lamp); white-space: nowrap; }
.pitches .pg.on { border-color: var(--lamp); background: var(--line); }
.pitches .pg.on i { color: var(--lamp); }
.seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { background: var(--panel); border: 0; min-height: 44px; font-size: 15px; font-weight: 700; }
.seg button.on { background: var(--clay); color: #fff; }
@media (prefers-reduced-motion: reduce) { #banner.show { animation: none; opacity: 1; } }
#codeIn { font: 500 30px var(--f-num); letter-spacing: .2em; width: 6.5ch; text-align: center; color: var(--chalk); background: var(--panel); border: 1px solid var(--lamp); border-radius: 10px; padding: 8px 4px; -webkit-user-select: text; user-select: text; touch-action: auto; }
#codeIn:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
#beast-code { display: block; box-sizing: border-box; width: min(100%, 16ch); margin: 12px auto 0; padding: 10px; border: 1px solid var(--lamp); border-radius: 10px; background: var(--panel); color: var(--chalk); font: 500 24px var(--f-num); text-align: center; -webkit-user-select: text; user-select: text; touch-action: auto; }
#beast-code:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
#review-request { position: absolute; left: 50%; bottom: 12%; transform: translateX(-50%); z-index: 8; width: max-content; max-width: 94%; padding: 12px 16px; background: #153d38; color: #fff1be; border: 2px solid #f4c95a; border-radius: 14px; font: 700 14px var(--f-body); touch-action: manipulation; }
#pitch-review-request { position: absolute; left: 50%; bottom: 22%; transform: translateX(-50%); z-index: 8; width: max-content; max-width: 94%; padding: 12px 16px; background: #153d38; color: #fff1be; border: 2px solid #f4c95a; border-radius: 14px; font: 700 14px var(--f-body); touch-action: manipulation; }
#review-actions { position: absolute; left: 0; right: 0; bottom: 12%; z-index: 8; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
#review-actions button { position: static; transform: none; pointer-events: auto; }
#review-skip { padding: 9px 18px; border: 1px solid #8ca79a; border-radius: 10px; background: #152d28; color: #eef3e8; font: 700 13px var(--f-body); touch-action: manipulation; }
#review-request[hidden], #pitch-review-request[hidden], #review-skip[hidden], #review-panel[hidden] { display: none; }
#review-panel { position: fixed; inset: 8px; max-width: 760px; margin: auto; z-index: 30; display: flex; flex-direction: column; justify-content: safe center; align-items: center; gap: 8px; padding: 12px; border: 1px solid #537d6b; border-radius: 14px; background: #081b19; text-align: center; overflow-y: auto; }
#review-panel small { color: #7bd6c4; font: 700 12px var(--f-num); letter-spacing: .2em; }
#review-panel h2 { margin: 0; color: #ffe4a0; font-size: clamp(24px, 7vw, 38px); }
#review-panel p { margin: 0; max-width: 34ch; line-height: 1.6; white-space: pre-line; }
#review-panel svg { width: min(100%, 320px); height: 65px; flex-shrink: 0; }
#review-panel .review-field { width: min(100%, 640px); height: clamp(90px, 21vh, 190px); flex-shrink: 0; border: 1px solid #537d6b; border-radius: 10px; }
#stage:has(#review-panel:not([hidden])) #beast-cut, #stage:has(#review-panel:not([hidden])) #beast-impact { display: none; }
#review-panel .review-detail { color: #ffe4a0; font-variant-numeric: tabular-nums; }
#review-panel button { margin-top: 0; flex-shrink: 0; }

/* Short, non-blocking beast cut-in; the centre clears before the pitch arrives. */
#beast-cut, #beast-impact { position: absolute; inset: 0; z-index: 4; pointer-events: none; overflow: hidden; contain: layout paint; }
#beast-cut[hidden], #beast-impact[hidden] { display: none; }
#stage:has(#overlay:not([hidden])) #beast-cut, #stage:has(#overlay:not([hidden])) #beast-impact { display: none; }
#beast-cut { background: radial-gradient(ellipse at center, transparent 35%, rgba(103, 24, 7, .65)); }
.beast-scar { position: absolute; inset: 4% -15%; background: repeating-linear-gradient(116deg, transparent 0 18%, #ffad46 18.4% 19%, #a32b13 19.4% 20%, transparent 21% 29%); clip-path: polygon(0 22%, 100% 3%, 100% 69%, 0 92%); }
.beast-eyes { position: absolute; top: 25%; left: 50%; width: min(72%, 460px); height: 10%; transform: translateX(-50%); display: flex; justify-content: space-between; }
.beast-eyes i { width: 34%; height: 20%; background: #fff0a9; box-shadow: 0 0 18px #ff6b20, 0 0 36px #ff3410; transform: rotate(14deg); clip-path: polygon(0 0, 100% 58%, 78% 100%, 15% 65%); }
.beast-eyes i + i { transform: scaleX(-1) rotate(14deg); }
.beast-call { position: absolute; left: 0; right: 0; top: 46%; padding: 16px 10px; text-align: center; color: #fff0c6; background: linear-gradient(100deg, transparent, #210f0af2 18% 82%, transparent); border-block: 1px solid #f89046; transform: skewY(-5deg); }
.beast-call small { display: block; font: 700 clamp(9px, 2.8vw, 13px)/1.5 var(--f-num); letter-spacing: .32em; color: #ffba67; }
.beast-call strong { display: block; font: 900 clamp(32px, 10vw, 70px)/1.3 var(--f-body); letter-spacing: .05em; text-shadow: 3px 3px #9f2a11, 0 0 22px #f76418; white-space: nowrap; }
.beast-call span { display: block; margin-top: 5px; font: 700 clamp(11px, 3vw, 15px)/1.5 var(--f-body); }
#beast-cut.release { animation: beast-edge 1.35s both; }
#beast-cut.release .beast-scar { animation: beast-split .5s both; }
#beast-cut.release .beast-eyes { animation: beast-glare .48s both; }
#beast-cut.release .beast-call { animation: beast-call 1.35s both; }
#beast-impact { background: radial-gradient(ellipse at 50% 65%, transparent 25%, #ff9e3338 60%, #ed43108c); border: 3px solid #ffd582; }
#beast-impact.strike { animation: beast-hit .38s ease-out both; }
@keyframes beast-edge { 0% { opacity: 0; } 8%, 25% { opacity: 1; } 55% { opacity: .55; } 100% { opacity: 0; } }
@keyframes beast-split { 0% { transform: translateX(-80%) scaleX(.4); opacity: 0; } 20% { transform: translateX(0) scaleX(1); opacity: 1; } 100% { transform: translateX(30%) scaleX(1.3); opacity: 0; } }
@keyframes beast-glare { 0% { opacity: 0; } 18%, 55% { opacity: 1; } 100% { opacity: 0; } }
@keyframes beast-call { 0% { transform: translateX(-40%) skewY(-5deg); opacity: 0; } 12%, 32% { transform: translateX(0) skewY(-5deg); opacity: 1; } 48%, 78% { transform: translateY(31vh) skewY(-5deg) scale(.65); opacity: .9; } 100% { transform: translateY(31vh) skewY(-5deg) scale(.65); opacity: 0; } }
@keyframes beast-hit { from { opacity: .85; transform: scale(.94); } to { opacity: 0; transform: scale(1.06); } }
@media (prefers-reduced-motion: reduce) {
  #beast-cut.release, #beast-cut.release .beast-call, #beast-impact.strike { animation: none; }
  #beast-cut { background: none; }
  #beast-cut .beast-eyes, #beast-cut .beast-scar, #beast-impact { display: none; }
  #beast-cut .beast-call { top: auto; bottom: 12%; padding: 8px; transform: none; }
  #beast-cut .beast-call strong { font-size: clamp(26px, 7vw, 42px); }
}
#goal .tired { color: var(--clay); }
#goal .star { color: #ffc845; }
#cmt { position: absolute; left: 12px; right: 12px; bottom: 34px; text-align: center; font: 700 14px/1.4 var(--f-body); color: #fff; background: rgba(6, 14, 12, .72); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; pointer-events: none; opacity: 0; transition: opacity .25s; }
#cmt.show { opacity: 1; }
#bgmBtn { position: absolute; top: 84px; right: 12px; z-index: 5; font: 700 11px var(--f-body); color: var(--chalk); background: rgba(6, 14, 12, .6); border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; min-height: 30px; }
#bgmBtn.off { opacity: .55; }
#cmtBtn { position: absolute; top: 10px; right: 12px; z-index: 5; font: 700 11px var(--f-body); color: var(--chalk); background: rgba(6, 14, 12, .6); border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; min-height: 30px; }

/* rolling die */
.dice-panel { display: none; align-items: center; gap: 10px; padding: 6px 12px; min-height: 66px; border: 1px solid var(--lamp); border-radius: 12px; background: var(--panel); pointer-events: none; }
.dice-panel.on { display: flex; }
.dice-wrap { position: relative; flex: 0 0 68px; width: 68px; height: 68px; perspective: 520px; transform: scale(.7); }
.dice-result { min-width: 0; font-size: 12px; line-height: 1.4; overflow-wrap: anywhere; }
.dice-result b { display: block; color: var(--lamp); font-size: 16px; }
.dice-sh { position: absolute; left: 4px; right: 4px; bottom: -16px; height: 12px; border-radius: 50%; background: rgba(0, 0, 0, .7); filter: blur(4px); }
.dice-roll, .dice-tilt, .dice { position: absolute; inset: 0; transform-style: preserve-3d; }
.dice-tilt { transform: rotateX(-22deg) rotateY(24deg); }
.dice .f { position: absolute; inset: 0; box-sizing: border-box; padding: 9px; display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr);
  background: linear-gradient(145deg, #fffdf6, #ece4d2); border: 1px solid #cfc3a8; border-radius: 12px; box-shadow: inset 0 0 8px rgba(0, 0, 0, .12); backface-visibility: hidden; }
.dice .f i { width: 11px; height: 11px; border-radius: 50%; background: #1d1d22; place-self: center; box-shadow: inset 0 1px 1px rgba(255, 255, 255, .25); }
.dice .f i.red { width: 17px; height: 17px; background: #d0302a; }

/* ハプニング・固有スキルの告知 */
#hap { position: absolute; left: 50%; top: 17%; transform: translate(-50%, -8px); max-width: 86%; padding: 8px 16px; border-radius: 12px; background: rgba(10, 20, 14, .82); border: 1px solid rgba(255, 220, 120, .6); color: #fff; text-align: center; pointer-events: none; z-index: 7; opacity: 0; transition: opacity .25s, transform .25s; }
#hap.show { opacity: 1; transform: translate(-50%, 0); }
#hap b { display: block; font-size: 17px; color: #ffd866; }
#hap span { display: block; font-size: 12px; margin-top: 2px; }
#stage.rain::after { content: ''; position: absolute; left: -20%; top: -40%; width: 140%; height: 180%; pointer-events: none; z-index: 3; opacity: .35;
  background: repeating-linear-gradient(104deg, transparent 0 14px, rgba(190, 215, 255, .55) 14px 15px); animation: rainfall .45s linear infinite; }
@keyframes rainfall { from { transform: translateY(-26px); } to { transform: translateY(0); } }

/* ===== デザイン調整（メニュー・ボタン・告知・演出） ===== */
.seg[hidden] { display: none; }
/* メニュー類が開いている間は試合用の表示をしまって、画面いっぱいに */
#app.ov .board, #app.ov .ctl { display: none; }
#app.ov #cmtBtn, #app.ov #bgmBtn, #app.ov #goal, #app.ov #spd, #app.ov #hapB, #app.ov #cmt, #app.ov #hint, #app.ov #hap { visibility: hidden; }

#overlay { background: radial-gradient(ellipse 90% 70% at 50% 42%, rgba(6, 14, 12, .5), rgba(6, 14, 12, .93) 78%); gap: 16px; }
#overlay.clear { background: radial-gradient(ellipse 90% 70% at 50% 42%, rgba(6, 14, 12, .15), rgba(6, 14, 12, .75) 80%); }
#overlay.clear h1 { font-size: clamp(44px, 14vw, 64px); }
#overlay h1 { text-shadow: 0 3px 0 #3a2208, 0 0 24px rgba(244, 201, 90, .25); }
#overlay p { color: #d6dccf; line-height: 1.55; }
#overlay.logo h1 { white-space: nowrap; font-size: clamp(36px, 10.8vw, 58px); line-height: 1.05; transform: rotate(-3deg); color: transparent;
  background: linear-gradient(180deg, #fff7d2 0%, #f8d567 48%, #e08a2c 100%); -webkit-background-clip: text; background-clip: text;
  text-shadow: none; filter: drop-shadow(0 4px 0 #4a2a0c) drop-shadow(0 0 18px rgba(244, 201, 90, .3)); }
#overlay.logo h1::before { content: 'ANIMAL LEAGUE'; display: block; font: 500 11px/1 var(--f-num); letter-spacing: .5em; color: #9fc4b3; -webkit-text-fill-color: #9fc4b3; margin-bottom: 8px; }
#obadge { display: flex; gap: 8px; justify-content: center; }
#obadge[hidden] { display: none; }
#obadge i { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; overflow: hidden;
  border: 2px solid rgba(255, 255, 255, .85); box-shadow: 0 3px 0 rgba(0, 0, 0, .45); animation: hop 2.4s ease-in-out infinite; }
#obadge i img { width: 38px; height: 38px; display: block; }
#obadge i:nth-child(2) { animation-delay: .15s; } #obadge i:nth-child(3) { animation-delay: .3s; } #obadge i:nth-child(4) { animation-delay: .45s; } #obadge i:nth-child(5) { animation-delay: .6s; }
@keyframes hop { 0%, 70%, 100% { transform: translateY(0); } 80% { transform: translateY(-7px); } 90% { transform: translateY(0); } }
#ospk { display: inline-flex; align-items: center; gap: 6px; padding: 3px 13px 3px 5px; box-shadow: 0 2px 6px rgba(0, 0, 0, .35); }
#ospk:empty { display: none; }
#ospk .av { width: 28px; height: 28px; border-radius: 50%; background: rgba(255, 255, 255, .18); }

#obtns { display: grid; grid-template-columns: 1fr; gap: 10px; width: min(300px, 82vw); }

.go { background: linear-gradient(180deg, #ee8150, #d25a2c); box-shadow: 0 4px 0 #8a3416; border-radius: 14px; letter-spacing: .04em; }
.go2 { background: rgba(16, 35, 31, .85); border: 1px solid #36594f; box-shadow: 0 3px 0 rgba(0, 0, 0, .45); border-radius: 14px; }
.go:active, .go2:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0, 0, 0, .45); }
.go2.menu { box-shadow: none; border-radius: 10px; }
#obtns button small { display: block; font: 500 11.5px/1.35 var(--f-body); color: var(--dim); margin-top: 3px; }
#obtns .go small { color: #ffe0cc; }
#obtns button.team { display: flex; align-items: center; gap: 10px; text-align: left; padding: 9px 14px 9px 12px; border-left: 6px solid var(--tc); }
#obtns button.team .av { width: 38px; height: 38px; flex: 0 0 38px; border-radius: 50%; background: var(--tc); border: 1.5px solid rgba(255, 255, 255, .75); }

/* 作戦ボタン：技（会心・魔球・守護神・代打）は色を変える */
.acts { flex-wrap: nowrap; }
.chip { font-size: 12.5px; line-height: 1.2; padding: 4px 3px; border-radius: 12px; box-shadow: 0 3px 0 rgba(0, 0, 0, .4); }
.chip.sp { color: #ffd9b0; border-color: #ff8a5a; background: linear-gradient(180deg, #3d2016, #24130d); }
.chip.sp.on { background: linear-gradient(180deg, #ffa26f, #f07038); color: #2a0f04; }
.chip:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0, 0, 0, .4); }
.seg { border-radius: 12px; }

/* スコアボードのチーム色 */
#slab i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 3px; vertical-align: 0; }

/* 結果の大きな文字 */
#banner .t { text-shadow: 0 3px 0 rgba(0, 0, 0, .6), 0 0 2px rgba(0, 0, 0, .9); }
#banner.big .t { font-size: clamp(34px, 10.5vw, 60px); color: transparent; background: linear-gradient(180deg, #fffbe0, #f8d567 50%, #e5892c);
  -webkit-background-clip: text; background-clip: text; text-shadow: none; filter: drop-shadow(0 4px 0 #3a1e06) drop-shadow(0 0 16px rgba(255, 210, 110, .55)); }
#banner.big.show { animation: popBig 2.6s ease-out forwards; }
@keyframes popBig { 0% { opacity: 0; transform: scale(.4) rotate(-6deg); } 10% { opacity: 1; transform: scale(1.18) rotate(-3deg); } 20% { transform: scale(1) rotate(-2deg); } 85% { opacity: 1; } 100% { opacity: 0; transform: scale(1.04) rotate(-2deg); } }

/* ハプニング */
#hap { top: 112px; border-radius: 14px; box-shadow: 0 6px 18px rgba(0, 0, 0, .45); }
#hap.alert { border-color: #ff9a5a; background: linear-gradient(180deg, rgba(60, 28, 14, .92), rgba(28, 14, 8, .92)); }
#hapB { position: absolute; top: 90px; left: 12px; z-index: 5; font: 700 11px var(--f-body); color: #ffd866; background: rgba(40, 26, 6, .72); border: 1px solid rgba(255, 216, 102, .6); border-radius: 999px; padding: 5px 10px; pointer-events: none; }
#hapB:empty { display: none; }
#stage.windU::before, #stage.windD::before { content: ''; position: absolute; inset: -10% -50%; pointer-events: none; z-index: 3; opacity: .5;
  background: repeating-linear-gradient(-4deg, transparent 0 26px, rgba(235, 245, 255, .22) 26px 27px, transparent 27px 61px); animation: windR 0.7s linear infinite; }
#stage.windD::before { animation-name: windL; }
@keyframes windR { from { transform: translateX(-60px); } to { transform: translateX(0); } }
@keyframes windL { from { transform: translateX(0); } to { transform: translateX(-60px); } }
@media (prefers-reduced-motion: reduce) { #banner.big.show { animation: none; opacity: 1; } #obadge i { animation: none; } }
#stage canvas { transition: filter .35s; }
#stage.dark canvas { filter: brightness(.45) saturate(.7); }
/* 球種ボタン：持ち球の数に合わせて横いっぱいに */
.pitches { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: 1fr; }
.pitches .pg { min-height: 46px; border-radius: 12px; font-size: 11.5px; box-shadow: 0 3px 0 rgba(0, 0, 0, .4); }
.pitches .pg i { font-size: 17px; }
#obtns .go.plain { font: 700 15px var(--f-body); background: rgba(16, 35, 31, .85); border: 1px solid #36594f; box-shadow: 0 3px 0 rgba(0, 0, 0, .45); letter-spacing: 0; }
#obtns .go.plain small { color: var(--dim); }

.chip { white-space: pre-line; }

#overlay.cred #od { white-space: pre-line; text-align: left; font-size: 12.5px; line-height: 1.7; max-width: 30ch; }

/* Story scenes share the existing overlay and keep tap targets within a phone. */
#overlay.story-scene { overflow-y: auto; place-content: center; background: linear-gradient(160deg, #102a30, #08131f); padding: max(16px, env(safe-area-inset-top)) 20px; gap: 12px; }
#overlay.story-scene #od { white-space: pre-line; font-size: 15px; line-height: 1.75; max-width: 28ch; }

#overlay[data-scene="analysis"], #overlay[data-scene="ai"] { background: radial-gradient(ellipse at 50% 20%, #173d43, #050c14 85%); }

#story-final button { position: absolute; bottom: max(25px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); border: 1px solid #555; background: #000; color: #aaa; font: 12px sans-serif; padding: 12px 20px; border-radius: 24px; }
#app.story-final .board, #app.story-final .ctl, #app.story-final #cmtBtn, #app.story-final #bgmBtn, #app.story-final #goal, #app.story-final #hint, #app.story-final #cmt, #app.story-final #spd, #app.story-final #banner, #app.story-final #hapB { display: none; }
@keyframes story-question { from { opacity: 0; } to { opacity: 1; } }

/* Illustrated story pages: artwork never sits behind the words. Japanese uses the
   available width rather than Latin `ch` measures that forced mid-phrase wraps. */
#overlay.story-scene { display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; gap: 0; padding: 16px 0; background: #101d21; text-align: left; overflow-y: auto; overscroll-behavior: contain; }

}

/* Real-world coda: three film cuts, with the balloon moving once and staying up. */
#overlay.story-scene #story-art.cinematic { position: relative; height: auto; max-height: none; aspect-ratio: 3 / 2; overflow: hidden; background: #293540; }
#story-art.cinematic > img { animation: ending-cut .85s ease-out both; }
#story-art.cinematic .ending-balloon-layer { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; pointer-events: none; }
#story-art.cinematic.released .ending-balloon { animation: ending-release 6s cubic-bezier(.2,.45,.4,1) forwards; }
#overlay[data-scene="real-jump"] .ending-balloon { animation: ending-catch 1s ease-out both; }
@keyframes ending-cut { from { opacity: .15; } to { opacity: 1; } }
@keyframes ending-release { from { transform: translate(0, 0); } to { transform: translate(70px, -205px); } }
@keyframes ending-catch { from { transform: translate(0, -8px) rotate(1deg); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) {
  #story-art.cinematic > img, #story-art.cinematic .ending-balloon { animation: none !important; }
  #story-art.cinematic.released .ending-balloon { transform: translate(70px, -205px); }
}

/* Titles use whole words; body, controls and headings have distinct weights. */
#overlay { box-sizing: border-box; min-width: 0; overflow-y: auto; overscroll-behavior: contain; }
#overlay h1 { max-width: 100%; font-family: var(--f-body); font-weight: 700; line-height: 1.4; text-shadow: none; word-break: normal; overflow-wrap: anywhere; }

#overlay.logo { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 22px 18px; }
#overlay.logo h1 { flex-shrink: 0; font: 700 clamp(29px, 8.5vw, 43px)/1.2 var(--f-body); white-space: normal; transform: none; letter-spacing: .035em; filter: drop-shadow(0 2px 0 #4a2a0c); }
#overlay.logo h1::before { font: 500 10px/1.3 var(--f-num); letter-spacing: .24em; margin-bottom: 10px; }
#overlay.logo #od { max-width: 28em; font-size: 14px; line-height: 1.7; }
#overlay.logo #obtns { width: 100%; max-width: 360px; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
#overlay.logo #obtns button { min-width: 0; min-height: 46px; padding: 9px 5px; font-size: 14px; white-space: nowrap; }
#overlay.logo #goBtn, #overlay.logo #go6 { grid-column: 1 / -1; }
#overlay.logo #goBtn { font-size: 16px; font-weight: 700; }
#overlay.logo #obadge { gap: 7px; }
#overlay.logo #obadge i { width: 36px; height: 36px; }
#overlay.logo #obadge i img { width: 34px; height: 34px; }
#story-final h1 { font: 700 clamp(27px, 7.5vw, 38px)/1.35 var(--f-body); letter-spacing: .03em; }
#banner .t { font-weight: 700; }

/* Story peaks: edge-to-edge cuts, a quiet pause, then a single impact. */
#overlay.story-spotlight { background: #080e18; --scene-accent: #8de7ed; }
#overlay[data-scene^="awakening-"] { --scene-accent: #ffc17c; background: #120e12; }
#overlay.story-spotlight #story-art { position: relative; height: clamp(210px, 44vh, 380px); max-height: none; aspect-ratio: auto; overflow: hidden; border-bottom: 2px solid var(--scene-accent); }
#overlay.story-spotlight #story-art img { object-fit: cover; animation: story-arrival 2.6s cubic-bezier(.15,.6,.3,1) both; }
#overlay[data-scene="invasion"] #story-art img { object-position: 35% center; }
#overlay[data-scene="ultimatum"] #story-art img { object-position: 58% center; }
#overlay[data-scene="awakening-roar"] #story-art img { animation: story-breakthrough 1.15s cubic-bezier(.1,.8,.2,1) both; }
#overlay.story-spotlight #story-art::after { content: ''; position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 -18px 30px -22px #080e18; }
#overlay.story-spotlight #od { color: #f7f0e7; font-size: 17px; line-height: 1.9; }
#overlay.story-spotlight #ospk { background: transparent !important; color: var(--scene-accent); border-radius: 0; padding-left: 0; }
#overlay.story-spotlight #ospk .av { display: none; }
#overlay.story-spotlight #goBtn { background: transparent; border: 1px solid #4b666d; box-shadow: none; color: #e7f2f1; }
#overlay.story-spotlight #obtns { margin-top: auto; margin-bottom: 12px; }
@keyframes story-arrival { from { opacity: .2; transform: scale(1.06); } to { opacity: 1; transform: scale(1); } }
@keyframes story-breakthrough { 0% { opacity: .25; transform: scale(1.13); } 35% { opacity: 1; transform: scale(1.015); } 100% { transform: scale(1); } }
@media (max-height: 620px) {
  #overlay.logo { gap: 11px; padding: 16px; }
  #overlay.logo h1 { font-size: 29px; }
  #overlay.logo #od { font-size: 13px; }
  #overlay.story-spotlight #od { font-size: 16px; }
}
@media (max-height: 470px) { #overlay.logo { justify-content: flex-start; } }
@media (prefers-reduced-motion: reduce) { #overlay.story-spotlight #story-art img { animation: none !important; } }

/* Clips keep their full frame; tap-to-play works with mobile media policies. */
#overlay.story-scene.dlg #go3 { grid-column: 1 / -1; font-size: 13px; min-height: 40px; padding: 7px 10px; }
#story-movie { position: absolute; inset: 0; z-index: 110; display: flex; flex-direction: column; justify-content: center; gap: 18px; box-sizing: border-box; overflow-y: auto; padding: 24px 0; background: #05090e; color: #f4efe3; }
#story-movie h2 { margin: 0 22px; font: 700 22px/1.5 var(--f-body); }
#story-movie video { display: block; width: 100%; max-height: 60vh; aspect-ratio: 16 / 9; object-fit: contain; background: #000; }
#story-movie > p { margin: 0 22px; min-height: 1.6em; font: 400 14px/1.6 var(--f-body); color: #b4c8cd; }
#story-movie > div { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 0 22px; }
#story-movie button { min-height: 44px; padding: 10px 13px; font: 500 14px/1.5 var(--f-body); }
#story-movie button[hidden] { display: none; }
@media (max-height: 470px) { #story-movie { justify-content: flex-start; } }

<body>
<div id="app">
  <header class="board">
    <div class="inn" id="inn">1回</div>
    <div class="cnt" aria-label="カウント">
      <div><em>B</em><span id="db" class="dots"></span></div>
      <div><em>S</em><span id="ds" class="dots"></span></div>

    </div>
    <svg id="dia" viewBox="0 0 40 34" width="44" height="38" aria-label="走者">
      <rect id="b2" x="15.5" y="2.5" width="9" height="9" transform="rotate(45 20 7)"></rect>
      <rect id="b1" x="27.5" y="14.5" width="9" height="9" transform="rotate(45 32 19)"></rect>

</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ---- 01-core.js ---- */
(() => {
'use strict';
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t * t * (3 - 2 * t);
const easeOut = t => 1 - (1 - t) * (1 - t);
const gauss = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
const now_ = () => performance.now() / 1000;
const D2R = Math.PI / 180;

if (!window.THREE) {
  $('#ot').textContent = '読み込みエラー';
  $('#od').textContent = '3D描画ライブラリを読み込めませんでした。通信状態を確認して再読み込みしてください。';
  $('#goBtn').hidden = true;
  return;
}
const V = (x, y, z) => new THREE.Vector3(x, y, z);
function rotY(v, a) { const c = Math.cos(a), s = Math.sin(a); return V(v.x * c + v.z * s, v.y, -v.x * s + v.z * c); }

/* world in meters: home plate front edge at z=0, pitcher toward -z, camera behind home at +z, x to the camera's right */
const RUBBER_Z = -18.44, MOUND_Y = 0.25, X0 = -0.8;   // X0: right-handed batter's stance line
const ZW = 0.34, ZY0 = 0.78, ZH = 0.34;               // strike zone half width, center height, half height (game-sized, larger than real)
const SLOW = 2.3;          // game time runs slower than real life so the ball is hittable
const SWING_LEAD = 0.1;    // tap -> bat reaches the ball
const DELIVER = 0.7;       // user's pitching motion length
const zoneToWorld = (tx, ty) => V(tx * ZW, ZY0 - ty * ZH, 0);

/* ---- sound ---- */
let ac = null, storySilent = false;
function audioInit() {
  if (storySilent) return;
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; } }
  if (ac && ac.state === 'suspended') ac.resume().catch(() => {});
  sfxLoad();
  bgmStartIfOn();
}
/* ---- 録音の効果音（効果音ラボ：商用無料・クレジット不要。素材ファイルの再配布は禁止なので、XOR して docs/sfx/*.bin に置いている。
   tools/make-sfx.py で作る）。読めない環境（Claude内のプレビューなど）では合成音のまま ---- */
const SFX_KEY = 'dobutsu-league-sfx', SFX_NAMES = ['bat1', 'bat2', 'batHR', 'mitt1', 'mitt2', 'slide1', 'slide2'];
const sfxRec = {};
let sfxReq = false;
function sfxLoad() {

function jerseyTex(base, trim, pin) {
  return canvasTex(128, 64, (g, w, h) => {
    g.fillStyle = base; g.fillRect(0, 0, w, h);
    if (pin) {
      g.fillStyle = trim; g.globalAlpha = 0.18;
      for (let x = 4; x < w; x += 8) g.fillRect(x, 0, 1.5, h);
      g.globalAlpha = 1;
    }
    g.fillStyle = trim;
    g.fillRect(0, 0, w, 7);                                      // 首元のリブ
    g.fillRect(w * 0.25 - 2, 7, 4, h);                           // 前立て（ボタンライン）
    g.fillRect(0, h - 5, w, 5);                                  // 裾ライン
  });
}
// 縞模様：腕（輪っか状）としっぽ（長さ方向の帯）。キャラの毛色に暗い縞をのせる
function stripeTex(base, ink, tail) {
  return canvasTex(64, 64, (g, w, h) => {
    g.fillStyle = base; g.fillRect(0, 0, w, h);
    g.fillStyle = ink;
    for (let i = 0; i < 4; i++) {
      const a = 6 + i * 15;
      if (tail) g.fillRect(a, 0, 7, h); else g.fillRect(0, a, w, 7);
    }
  });
}

function fielderJ(x, z, yaw, ph, mv, ready, reach) {

function stopBeastSound() {

  try { const t=context.currentTime; gain.gain.cancelScheduledValues(t);gain.gain.setTargetAtTime(0,t,.015);nodes.forEach(n=>{try{n.stop(t+.06);}catch(e){}}); } catch(e) {}

    filter.type='lowpass';filter.frequency.setValueAtTime(1300,t);filter.frequency.exponentialRampToValueAtTime(180,t+1.05);
    gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(.065,t+.045);gain.gain.exponentialRampToValueAtTime(.0001,t+1.1);
    filter.connect(gain);gain.connect(context.destination);

      n.frequency.setValueAtTime(frequency*1.9,t);n.frequency.exponentialRampToValueAtTime(frequency,t+.12);n.frequency.exponentialRampToValueAtTime(frequency*.55,t+1.1);

}

/* run fn with Math.random replaced by a seeded generator (mulberry32) */
function withSeed(seed, fn) {
  const R = Math.random;
  let a = seed >>> 0;
  Math.random = () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  try { return fn(); } finally { Math.random = R; }
}

/* which roster bats and which fields right now */
function teamsNow() {
  if (match && G) { const bat = battingSide() === match.side ? match.mine : match.opp; return { bat, fld: bat === match.mine ? match.opp : match.mine }; }
  if (online && G) { const bat = battingSide() === 'home' ? 'home' : 'away'; return { bat, fld: bat === 'home' ? 'away' : 'home' }; }

function teamState(t) {

  return G.teams[t];
}
const STORY_BAT = [
  ['コタロウ', 5, 4, '', 4, 'home'], ['ミケ', 5, 4, 'S', 5, 'neko'], ['ウサミ', 4, 3, 'L', 5, 'usagi'],
  ['トラ', 4, 5, '', 4, 'tiger'], ['ヒグマ', 3, 6, '', 2, 'kuma'], ['パン太', 4, 3, 'L', 3, 'away'],
  ['モカ', 4, 3, '', 5, 'floppy'], ['ハチ', 4, 3, 'S', 4, 'home'], ['ソラ', 3, 3, 'L', 4, 'home']

function curBatter() {
  const t = teamsNow().bat, s = teamState(t), slot = s.order % 9;
  let sub = !!(s.sub && s.sub[slot]), b = sub ? ROSTER[t].ph : ROSTER[t].bat[slot];
  if (story && t === 'home' && !sub) b = STORY_BAT[slot];
  if (story && t === story.opp && story.batRatings) {
    b = [...b]; b[1] = story.batRatings.m; b[2] = story.batRatings.p;
    b[3] = (b[3] || '').replace('*', '');

function spendStamina(speed, key) {

function relieve(t, to, closer) {

/* CPU managers go to the bullpen when the pitcher is spent */
function cpuRelief() {
  if (online || mode !== 'bat') return;

  set.forEach(k => { if (!(k in GANG)) return; let d = Math.abs(GANG[k] - GANG[key]); if (d > 180) d = 360 - d; if (d < bd) { bd = d; best = k; } });
  return best;
}

let lastT = now_(), perfN = 0, perfSum = 0, degraded = LITE;
let pausedAt = 0;
function frame() {
  const now = now_(), rawDt = now - lastT, dt = Math.min(0.05, rawDt); lastT = now;
  syncStadium();
  updateOnlineReview(now);
  if(onlineReview.active){renderReviewField();requestAnimationFrame(frame);return;}
  // The movie covers the stadium. Leave the decoder the GPU/CPU budget instead
  // of rendering an invisible 3D scene throughout the cutscene.
  if (storyMovie) { if (phase !== 'idle' && !pausedAt) pausedAt = now; requestAnimationFrame(frame); return; }
  if (renderMascotGallery(now)) { requestAnimationFrame(frame); return; }
  if (!degraded && !document.hidden && rawDt < 0.5) {
    perfN++; perfSum += rawDt;
    if (perfN >= 90) {
      if (perfSum / perfN > 0.034) { degraded = true; renderer.setPixelRatio(1); key.castShadow = false; resize(); }
      perfN = 0; perfSum = 0;
    }
  }
  // offline game: the game holds still while the menu sheet is open, then picks up where it was
  if (!online && !$('#overlay').hidden && phase !== 'idle') {
    if (!pausedAt) pausedAt = now;
    renderer.render(scene, camera); requestAnimationFrame(frame); return;
  }
  if (pausedAt) {
    const d = now - pausedAt; pausedAt = 0;
    nextAt += d; deliverStart += d; shakeUntil += d;
    if (ball) ball.start += d;
    if (play) { play.start += d; if (play.shot) play.shot.at += d; }
    if (pendBanner) pendBanner.at += d;
    if (brawl) { brawl.at += d; brawl.end += d; brawl.shot.at += d; }
    hbpUntil += d;
    if (batAnim) batAnim.t0 += d;
    if (swing) swing.time += d;
  }
  if (phase === 'wait' && timeOut && !online) nextAt = Math.max(nextAt, now + 1.0);   // タイム中は投げない
  if (phase === 'wait' && now >= nextAt) { if (!tryCpuPickoff(now)) cpuPitch(); }
  else if (phase === 'pick') stepPickoff(now);
  else if (phase === 'deliver' && now >= deliverStart + DELIVER) { const p = pending; pending = null; launchBall(p); }
  else if (phase === 'fly' && ball) stepFly(now);
  else if (phase === 'result' && now >= nextAt) afterResult();
  if (play && play.pend) stepThrowPick(now);
  if (pendBanner && now >= pendBanner.at) flushBanner();
  update(now, dt);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
if (window.ResizeObserver) new ResizeObserver(resize).observe($('#stage'));
window.addEventListener('resize', resize);
buildPitchButtons(); setTeams(); resize(); newGame(); showMenu(); inviteBoot();
requestAnimationFrame(frame);
})();
