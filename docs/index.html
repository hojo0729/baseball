<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a1815">
<title>ナイター対決</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DM+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box; }
[hidden] { display: none !important; }
:root {
  /* layout: one-screen night stadium. scoreboard strip on top, full-bleed 3D catcher-view canvas, thumb-reach controls at the bottom */
  --bg: #0a1815;
  --panel: #10231f;
  --line: #27423b;
  --chalk: #eef0e4;
  --dim: #8da79b;
  --clay: #d9683b;
  --lamp: #f4c95a;
  --good: #5fd08a;
  --f-disp: 'Dela Gothic One', 'Hiragino Sans', 'Yu Gothic', sans-serif;
  --f-body: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', sans-serif;
  --f-num: 'DM Mono', ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--chalk);
  font: 500 14px/1.4 var(--f-body);
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
  overflow: hidden;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#app { height: 100%; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }

.board {
  display: grid; grid-template-columns: auto 1fr auto auto; gap: 14px; align-items: center;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px;
}
.inn { font: 400 22px/1 var(--f-disp); min-width: 2.2em; }
.cnt { display: grid; gap: 2px; justify-self: center; }
.cnt div { display: flex; align-items: center; gap: 6px; }
.cnt em { font: 500 11px var(--f-num); font-style: normal; color: var(--dim); width: 1ch; }
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: #1b322c; border: 1px solid var(--line); box-sizing: border-box; }
#db i.on { background: var(--good); border-color: var(--good); }
#ds i.on { background: var(--lamp); border-color: var(--lamp); }
#do i.on { background: var(--clay); border-color: var(--clay); }
#dia rect { fill: #1b322c; stroke: var(--line); stroke-width: 1; }
#dia rect.on { fill: var(--lamp); stroke: var(--lamp); }
.score { text-align: right; line-height: 1.1; }
.score small { display: block; font-size: 11px; color: var(--dim); }
.score b { font: 500 26px/1 var(--f-num); font-variant-numeric: tabular-nums; }

#stage { position: relative; flex: 1; min-height: 0; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: #07120f; }
canvas { display: block; width: 100%; height: 100%; }
#banner { position: absolute; left: 0; right: 0; top: 36%; text-align: center; pointer-events: none; opacity: 0; padding: 0 12px; }
#banner .t { font: 400 clamp(32px, 10.5vw, 54px)/1.1 var(--f-disp); text-shadow: 0 3px 0 rgba(0, 0, 0, .55); text-wrap: balance; }
#banner .s { margin-top: 8px; font: 500 13px var(--f-num); color: var(--chalk); text-shadow: 0 1px 0 rgba(0, 0, 0, .6); }
#banner.g .t { color: var(--lamp); }
#banner.n .t { color: var(--chalk); }
#banner.b .t { color: var(--clay); }
#banner.show { animation: pop 1.5s ease-out forwards; }
@keyframes pop { 0% { opacity: 0; transform: scale(.7); } 12% { opacity: 1; transform: scale(1.08); } 24% { transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; } }
#spd { position: absolute; top: 10px; right: 12px; font: 500 13px var(--f-num); color: var(--chalk); background: rgba(6, 14, 12, .6); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; pointer-events: none; }
#spd:empty { display: none; }
#hint { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; font-size: 12px; color: var(--chalk); text-shadow: 0 1px 2px rgba(0,0,0,.8); pointer-events: none; padding: 0 12px; }

#overlay { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 14px; text-align: center; background: rgba(6, 14, 12, .78); padding: 24px; }
#overlay h1 { font: 400 clamp(30px, 9vw, 44px)/1.1 var(--f-disp); margin: 0; color: var(--lamp); text-wrap: balance; }
#overlay p { margin: 0; max-width: 30ch; color: var(--chalk); }
#overlay[hidden] { display: none; }
#ospk { font: 700 13px var(--f-body); color: #fff; background: var(--clay); border-radius: 999px; padding: 4px 12px; }
#ospk:empty { display: none; }
#overlay.dlg { place-content: end center; padding-bottom: 36px; background: linear-gradient(rgba(6, 14, 12, .15), rgba(6, 14, 12, .9) 55%); }
#overlay.dlg #od { font-size: 17px; line-height: 1.6; max-width: 24ch; }
#obtns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.go2 { font: 700 15px var(--f-body); background: rgba(6, 14, 12, .5); border: 1px solid var(--line); border-radius: 10px; padding: 12px 20px; min-height: 48px; color: var(--chalk); }
.go2.menu { width: 100%; min-height: 44px; padding: 8px; }
.acts { display: flex; gap: 6px; }
.acts[hidden] { display: none; }
.chip { flex: 1 1 0; min-width: 0; font: 700 14px var(--f-body); color: var(--lamp); background: var(--panel); border: 1px solid var(--lamp); border-radius: 10px; min-height: 44px; padding: 6px 4px; }
.chip.on { background: var(--lamp); color: #1a1406; }
#goal { position: absolute; top: 10px; left: 12px; max-width: 62%; font: 700 12px/1.4 var(--f-body); color: var(--chalk); background: rgba(6, 14, 12, .6); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; pointer-events: none; }
#goal:empty { display: none; }
#goal .hot { color: var(--lamp); }
#spd.hot { color: #ff9a5a; border-color: #ff9a5a; }
button { font-family: var(--f-body); color: var(--chalk); cursor: pointer; }
button:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
.go { font: 400 18px var(--f-disp); background: var(--clay); border: 0; border-radius: 10px; padding: 14px 28px; min-height: 48px; color: #fff; }

.ctl { display: flex; flex-direction: column; gap: 8px; }
.pitches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; }
.pitches[hidden] { display: none; }
.pitches .pg { color: var(--chalk);  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; min-height: 40px; font-size: 11px; font-weight: 700; padding: 3px 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-width: 0; }
.pitches .pg b { font-weight: 700; white-space: nowrap; }
.pitches .pg i { font: 700 15px/1.1 var(--f-num); font-style: normal; color: var(--lamp); white-space: nowrap; }
.pitches .pg.on { border-color: var(--lamp); background: var(--line); }
.pitches .pg.on i { color: var(--lamp); }
.seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { background: var(--panel); border: 0; min-height: 44px; font-size: 15px; font-weight: 700; }
.seg button.on { background: var(--clay); color: #fff; }
@media (prefers-reduced-motion: reduce) { #banner.show { animation: none; opacity: 1; } }
#codeIn { font: 500 30px var(--f-num); letter-spacing: .2em; width: 6.5ch; text-align: center; color: var(--chalk); background: var(--panel); border: 1px solid var(--lamp); border-radius: 10px; padding: 8px 4px; -webkit-user-select: text; user-select: text; touch-action: auto; }
#codeIn:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
#goal .tired { color: var(--clay); }
#cmt { position: absolute; left: 12px; right: 12px; bottom: 34px; text-align: center; font: 700 14px/1.4 var(--f-body); color: #fff; background: rgba(6, 14, 12, .72); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; pointer-events: none; opacity: 0; transition: opacity .25s; }
#cmt.show { opacity: 1; }
#cmtBtn { position: absolute; top: 10px; right: 12px; z-index: 5; font: 700 11px var(--f-body); color: var(--chalk); background: rgba(6, 14, 12, .6); border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; min-height: 30px; }
</style>
</head>
<body>
<div id="app">
  <header class="board">
    <div class="inn" id="inn">1回</div>
    <div class="cnt" aria-label="カウント">
      <div><em>B</em><span id="db" class="dots"></span></div>
      <div><em>S</em><span id="ds" class="dots"></span></div>
      <div><em>O</em><span id="do" class="dots"></span></div>
    </div>
    <svg id="dia" viewBox="0 0 40 34" width="44" height="38" aria-label="走者">
      <rect id="b2" x="15.5" y="2.5" width="9" height="9" transform="rotate(45 20 7)"></rect>
      <rect id="b1" x="27.5" y="14.5" width="9" height="9" transform="rotate(45 32 19)"></rect>
      <rect id="b3" x="3.5" y="14.5" width="9" height="9" transform="rotate(45 8 19)"></rect>
    </svg>
    <div class="score"><small id="slab">得点</small><b id="runs">0</b></div>
  </header>

  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="banner"><div class="t" id="bt"></div><div class="s" id="bs"></div></div>
    <div id="cmt"></div>
    <button id="cmtBtn" aria-label="実況切り替え">実況 声</button>
    <div id="hint"></div>
    <div id="spd"></div>
    <div id="goal"></div>
    <div id="overlay">
      <div id="ospk"></div>
      <h1 id="ot">どうぶつリーグ</h1>
      <p id="od"></p>
      <input id="codeIn" type="text" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="部屋番号" hidden>
      <div id="obtns">
        <button class="go" id="goBtn">ストーリー</button>
        <button class="go2" id="go2" hidden>フリー対戦</button>
        <button class="go2" id="go3" hidden>オンライン対戦</button>
      </div>
    </div>
  </div>

  <footer class="ctl">
    <div class="pitches" id="pitches" hidden></div>
    <div class="seg" role="group" aria-label="モード">
      <button id="mBat" class="on">打つ</button>
      <button id="mPit">投げる</button>
    </div>
    <div class="acts" id="acts" hidden></div>
    <button class="go2 menu" id="menuBtn" hidden>メニュー</button>
  </footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ---- 01-core.js ---- */
(() => {
'use strict';
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t * t * (3 - 2 * t);
const easeOut = t => 1 - (1 - t) * (1 - t);
const gauss = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
const now_ = () => performance.now() / 1000;
const D2R = Math.PI / 180;

if (!window.THREE) {
  $('#ot').textContent = '読み込みエラー';
  $('#od').textContent = '3D描画ライブラリを読み込めませんでした。通信状態を確認して再読み込みしてください。';
  $('#goBtn').hidden = true;
  return;
}
const V = (x, y, z) => new THREE.Vector3(x, y, z);
function rotY(v, a) { const c = Math.cos(a), s = Math.sin(a); return V(v.x * c + v.z * s, v.y, -v.x * s + v.z * c); }

/* world in meters: home plate front edge at z=0, pitcher toward -z, camera behind home at +z, x to the camera's right */
const RUBBER_Z = -18.44, MOUND_Y = 0.25, X0 = -0.8;   // X0: right-handed batter's stance line
const ZW = 0.34, ZY0 = 0.78, ZH = 0.34;               // strike zone half width, center height, half height (game-sized, larger than real)
const SLOW = 2.3;          // game time runs slower than real life so the ball is hittable
const SWING_LEAD = 0.1;    // tap -> bat reaches the ball
const DELIVER = 0.7;       // user's pitching motion length
const zoneToWorld = (tx, ty) => V(tx * ZW, ZY0 - ty * ZH, 0);

/* ---- sound ---- */
let ac = null;
function audioInit() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; } }
  if (ac && ac.state === 'suspended') ac.resume().catch(() => {});
}
function burst(f, d, vol, type) {
  if (!ac) return;
  try {
    const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(f, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(40, f * 0.4), t + d);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + d);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + d);
  } catch (e) {}
}
function noise(d, vol, fc, rise) {
  if (!ac) return;
  try {
    const n = Math.floor(ac.sampleRate * d), b = ac.createBuffer(1, n, ac.sampleRate), ch = b.getChannelData(0);
    for (let i = 0; i < n; i++) ch[i] = Math.random() * 2 - 1;
    const s = ac.createBufferSource(); s.buffer = b;
    const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = fc; f.Q.value = 0.8;
    const g = ac.createGain(), t = ac.currentTime;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + d * (rise || 0.08));
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    s.connect(f); f.connect(g); g.connect(ac.destination); s.start(t);
  } catch (e) {}
}
const sfx = {
  crack() { burst(1400, 0.09, 0.16, 'square'); burst(180, 0.14, 0.2, 'triangle'); noise(0.08, 0.25, 2500, 0.05); },
  pop() { burst(240, 0.09, 0.2, 'triangle'); noise(0.07, 0.3, 900, 0.05); },
  swish() { noise(0.16, 0.14, 1800, 0.5); },
  cheer(k) { noise(0.9 + k * 0.7, 0.05 + k * 0.05, 700, 0.35); }
};

/* ---- pitch types. brk: zone units the ball breaks late (A = where it seems to head). gf: gravity drop factor ---- */
const TYPES = {
  str: { name: 'ストレート',     short: 'ストレート', ico: '↑',  min: 128, max: 152, n: 3,   brk: [0, 0.05],     gf: 0.45, hard: 0,    w: 26, ax: [1, 0, 0],    rps: 40 },
  two: { name: 'ツーシーム',     short: 'ツーシーム', ico: '↖',  min: 125, max: 147, n: 3,   brk: [0.32, -0.05], gf: 0.7,  hard: 0.1,  w: 8,  ax: [1, 0.5, 0],  rps: 35 },
  cut: { name: 'カットボール',   short: 'カット',     ico: '↗',  min: 127, max: 145, n: 5,   brk: [-0.4, 0.05],  gf: 0.6,  hard: 0.3,  w: 8,  ax: [1, -0.6, 0], rps: 40 },
  sli: { name: 'スライダー',     short: 'スライダー', ico: '→', min: 112, max: 131, n: 4,   brk: [-0.95, 0.1],  gf: 0.8,  hard: 0.5,  w: 14, ax: [0.3, 1, 0],  rps: 45 },
  cur: { name: 'カーブ',         short: 'カーブ',     ico: '↘', min: 92,  max: 114, n: 3.2, brk: [-0.3, -1.15], gf: 1.0,  hard: 0.5,  w: 10, ax: [1, 0.3, 0],  rps: -40 },
  frk: { name: 'フォーク',       short: 'フォーク',   ico: '↓',  min: 122, max: 140, n: 5,   brk: [0, -0.95],    gf: 0.9,  hard: 0.6,  w: 8,  ax: [1, 0, 0],    rps: 6 },
  chg: { name: 'チェンジアップ', short: 'チェンジ',   ico: '↑ゆっくり',  min: 104, max: 124, n: 3,   brk: [0.15, -0.4],  gf: 0.85, hard: 0.45, w: 9,  ax: [1, 0.5, 0],  rps: 20 },
  sht: { name: 'シュート',       short: 'シュート',   ico: '←', min: 122, max: 140, n: 4,   brk: [0.85, 0.08],  gf: 0.7,  hard: 0.35, w: 6,  ax: [0.3, -1, 0], rps: -35 },
  snk: { name: 'シンカー',       short: 'シンカー',   ico: '↙',  min: 120, max: 138, n: 4,   brk: [0.55, -0.65], gf: 0.9,  hard: 0.4,  w: 6,  ax: [0.6, -1, 0], rps: -30 },
  gou: { name: '剛速球',         short: '剛速球',     ico: '↑速く', min: 155, max: 168, n: 3, brk: [0, 0.12], gf: 0.25, hard: 0.3, w: 2,  ax: [1, 0, 0],    rps: 55 },
  knk: { name: 'ナックル',       short: 'ナックル',   ico: 'ジグザグ', min: 78,  max: 104, n: 3,   brk: [0, -0.2],     gf: 0.9,  hard: 1,    w: 3,  ax: [1, 0, 0],    rps: 1, wob: 0.34 }
};

/* ---- game state ---- */
let mode = 'bat', ptype = 'str', story = null;
let G = null;
let phase = 'idle';            // idle | wait | deliver | fly | result
let ball = null, swing = null, play = null, batAnim = null, pending = null, flick = null, aim = null;
let nextAt = 0, deliverStart = 0, shakeUntil = 0, shakeAmp = 0, pendBanner = null;

function newGame() { G = { inning: 1, outs: 0, b: 0, s: 0, runs: 0, bases: [0, 0, 0], hits: 0, hr: 0, so: 0, over: false, pa: 0, lastAnn: -1 }; hud(); }

function dots(id, n, on) {
  const el = $(id);
  if (el.children.length !== n) el.innerHTML = '<i></i>'.repeat(n);
  [...el.children].forEach((c, i) => c.classList.toggle('on', i < on));
}
function hud() {
  $('#inn').textContent = Math.min(G.inning, 3) + '回';
  dots('#db', 3, G.b); dots('#ds', 2, G.s); dots('#do', 2, G.outs);
  G.bases.forEach((v, i) => $('#b' + (i + 1)).classList.toggle('on', !!v));
  $('#runs').textContent = G.runs;
  $('#slab').textContent = mode === 'bat' ? '得点' : '失点';
  if (online) {
    const sc = onlineScore();
    $('#inn').textContent = inningLabel(); $('#slab').textContent = 'しば - パン'; $('#runs').textContent = sc.home + '-' + sc.away;
  }
  updateRunners();
  updateGoal();
}
function setHint(t) { $('#hint').textContent = t; }
function showBanner(t, s, tone) {
  const b = $('#banner');
  b.className = tone;
  $('#bt').textContent = t; $('#bs').textContent = s || '';
  void b.offsetWidth;
  b.classList.add('show');
  commentBanner(t, s);
}
function hideBanner() { $('#banner').className = ''; }
function queueBanner(at, t, sub, tn, cheer) { pendBanner = { at, t, sub, tn, cheer }; }
function flushBanner() {
  if (!pendBanner) return;
  const p = pendBanner; pendBanner = null;
  stealAnim = null;
  hud(); showBanner(p.t, p.sub, p.tn);
  if (p.cheer) sfx.cheer(p.cheer);
}

/* ---- count / base logic ---- */
function endPA() { G.b = 0; G.s = 0; G.pa++; nextBatter(); }
function endInning(label) {
  if (online) { onl.score[battingSide()] += G.runs; G.runs = 0; }   // bank this half's runs for the batting team
  G.outs = 0; G.bases = [0, 0, 0]; G.inning++;
  if (G.inning > (G.maxHalf || 3)) G.over = true;
  if (online && G.inning === 6 && onl.score.home > onl.score.away) G.over = true;   // home leads after the top of the 3rd
  return label + ' / チェンジ';
}
function out(label) {
  endPA(); G.outs++;
  return G.outs >= 3 ? endInning(label) : label;
}
/* ground ball with a runner on first: runner forced at second, batter out at first */
function doublePlay() {
  const B = G.bases.slice();
  endPA(); G.outs += 2;
  if (G.outs >= 3) return endInning('ゲッツー');
  const sc = B[2] ? 1 : 0;
  G.bases = [0, 0, B[1] ? 1 : 0]; G.runs += sc;
  return 'ゲッツー' + (sc ? ' ' + sc + '点' : '');
}
/* ground out: batter out at first, forced runners move up one base */
function groundOut(label) {
  const B = G.bases.slice();
  const res = out(label);
  if (G.outs === 0) return res;              // that out ended the inning
  let sc = 0; const nb = [0, B[1], B[2]];
  if (B[0]) { if (B[1]) { if (B[2]) sc++; nb[2] = 1; } nb[1] = 1; }
  G.bases = nb; G.runs += sc;
  return res + (B[0] ? ' 進塁' : '') + (sc ? ' ' + sc + '点' : '');
}
/* deep fly with a runner on third and fewer than two outs: runner tags up and scores */
function sacFly() {
  const res = out('犠牲フライ');
  if (G.outs === 0) return res;
  G.bases[2] = 0; G.runs++;
  return res + ' 1点';
}
function strike() { G.s++; if (G.s >= 3) { G.so++; return out('三振'); } return null; }
function ballCount() { G.b++; return G.b >= 4 ? walk() : null; }
function walk() {

/* ---- right-handed batter ---- */
function makeSwingPlan(C) {
  const hy = clamp(C.y + 0.12, 0.8, 1.3), dy = C.y - hy, hl = Math.sqrt(Math.max(0.05, 0.62 * 0.62 - dy * dy));
  const Gc = V(clamp(C.x - hl, X0 + 0.12, X0 + 0.62), hy, 0.02);
  const dc = C.clone().sub(Gc); dc.z = 0; dc.normalize();
  return [
    { t: 0, G: V(X0 + 0.24, 1.0, 0.26), d: V(0.12, 0.85, 0.5).normalize(), th: -0.2 },
    { t: 0.05, G: V(X0 + 0.24, hy + 0.12, 0.14), d: V(0.15, 0.2, 1).normalize(), th: 0.3 },
    { t: SWING_LEAD, G: Gc, d: dc, th: 0.95 },
    { t: 0.17, G: V(X0 + 0.38, hy + 0.1, -0.24), d: V(0, 0.15, -1).normalize(), th: 1.45 },
    { t: 0.34, G: V(X0 + 0.2, 1.12, -0.12), d: V(-0.7, 0.4, 0.55).normalize(), th: 1.8 }

}
function slerpVec(a, b, u) {
  const c = clamp(a.dot(b), -1, 1), om = Math.acos(c);
  if (om < 1e-3) return a.clone().lerp(b, u).normalize();
  const s = Math.sin(om);
  return a.clone().multiplyScalar(Math.sin((1 - u) * om) / s).add(b.clone().multiplyScalar(Math.sin(u * om) / s)).normalize();
}
function swingAt(tau, plan) {
  if (tau >= plan[plan.length - 1].t) { const k = plan[plan.length - 1]; return { G: k.G.clone(), dir: k.d.clone(), th: k.th }; }
  let i = 0; while (plan[i + 1].t <= tau) i++;
  const a = plan[i], b = plan[i + 1];
  let u = (tau - a.t) / (b.t - a.t);
  if (i === plan.length - 2) u = easeOut(u);
  return { G: a.G.clone().lerp(b.G, u), dir: slerpVec(a.d, b.d, u), th: lerp(a.th, b.th, u) };
}
function batterJ(now, k) {
  const step = clamp((k - 0.45) / 0.45, 0, 1), lift = Math.sin(step * Math.PI) * 0.07;
  let G, dir, th;
  const sw = batAnim && now >= batAnim.t0 ? now - batAnim.t0 : -1;
  if (sw < 0) {
    const w = Math.sin(now * 3) * 0.03 * (1 - step);
    G = V(X0 + 0.24, 1.0 + w * 0.3, 0.26); dir = V(0.12 + w, 0.85, 0.5).normalize(); th = -0.2 - step * 0.08;
  } else ({ G, dir, th } = swingAt(sw, batAnim.plan));

  const P = V(X0, 0.95 - 0.03 * step, 0.06);
  const hipF = P.clone().add(rotY(V(0, -0.04, -0.12), th * 0.6)), hipB = P.clone().add(rotY(V(0, -0.04, 0.12), th * 0.6));
  const fF = V(X0 + 0.02, lift, -0.36 - 0.1 * step), fB = V(X0 - 0.04, 0, 0.46);
  const kF = hipF.clone().lerp(fF, 0.5).add(V(0.1, 0.03, 0)), kB = hipB.clone().lerp(fB, 0.5).add(V(0.11, 0, 0));

  const sF = N.clone().add(rotY(V(0, -0.03, -0.19), th)), sB = N.clone().add(rotY(V(0, -0.03, 0.19), th));

/* ---- right-handed pitcher. k: 0 set, 0-0.35 leg lift, 0.35-1 stride and arm, 1 release, 1-1.35 follow-through ---- */
function pitcherJ(k) {
  const M = MOUND_Y, Z0 = RUBBER_Z;
  const lift = k < 0.35 ? ease(k / 0.35) : k < 0.55 ? 1 : 1 - ease(clamp((k - 0.55) / 0.25, 0, 1));
  const s = ease(clamp((k - 0.5) / 0.5, 0, 1));
  const fe = easeOut(clamp((k - 1) / 0.35, 0, 1));
  const th = k < 0.4 ? -1.2 * ease(k / 0.4) : k < 1 ? -1.2 + 1.65 * ease(clamp((k - 0.6) / 0.4, 0, 1)) : 0.45 + 0.35 * fe;
  const P = V(0.02, M + 0.98 - 0.14 * s + 0.03 * lift, Z0 + 0.15 + 0.75 * s + 0.25 * fe);
  const fR = V(-0.12, M + 0.12 * Math.sin(fe * Math.PI), Z0 + 0.05 + 0.55 * fe);
  const fL = V(0.08, M + 0.42 * lift, Z0 + 0.05 + 0.05 * lift).lerp(V(0.14, M - 0.06, Z0 + 1.55), s);
  const hipL = P.clone().add(rotY(V(0.12, -0.05, 0), th * 0.5)), hipR = P.clone().add(rotY(V(-0.12, -0.05, 0), th * 0.5));

  const N = P.clone().add(V(0, 0.47 - 0.05 * (s + fe), -0.05 * lift + 0.2 * s + 0.15 * fe));
  const sR = N.clone().add(rotY(V(-0.19, -0.03, 0), th)), sL = N.clone().add(rotY(V(0.19, -0.03, 0), th));
  const C0 = N.clone().add(V(0.02, -0.2, 0.2));
  const arm = phi => { const r = phi * D2R; return sR.clone().add(V(-0.05, Math.cos(r) * 0.62, -Math.sin(r) * 0.62)); };
  let hR;
  if (k < 0.35) hR = C0.clone();
  else if (k < 0.75) { const u = (k - 0.35) / 0.4; hR = C0.clone().lerp(arm(180 - 150 * ease(u)), clamp(u / 0.25, 0, 1)); }

}

/* ===== strategy and running game: steal, double steal, hit-and-run, bunt, squeeze, pickoffs ===== */
const BASE_PT = { 1: V(19.4, 1.2, -19.4), 2: V(0, 1.2, -38.8), 3: V(-19.4, 1.2, -19.4) };
const throwMesh = new THREE.Mesh(new THREE.SphereGeometry(BALL_R * 2.2, 12, 8), mat('#ffffff', { roughness: 0.5 }));
throwMesh.visible = false; scene.add(throwMesh);
let sign = null;               // batting sign chosen before the pitch: steal | run | bunt | squeeze
let curBunt = false;           // the batter is squared to bunt on this pitch
let steal = null, stealAnim = null, cpuStealPlan = false, cpuBuntPlan = false, pickoff = null;
const runSign = () => sign === 'steal' || sign === 'run' || sign === 'squeeze';
const SIGN_HINT = {
  steal: '盗塁のサイン。投球と同時に走者が走る',
  run: 'エンドラン。走者が走るので必ず打とう（ゴロでもゲッツーにならない）',
  bunt: 'バント。ボールが通る位置をタップしてバットを当てる',
  squeeze: 'スクイズ。3塁走者が突っ込む。必ずバットに当てよう'
};

/* bases (0 = first, 1 = second) whose runners would run, lead runner first. No steals of home. */
function stealers() {
  if (!G) return [];
  const B = G.bases, r = [];
  if (B[1] && !B[2]) r.push(1);
  if (B[0] && (!B[1] || r.includes(1))) r.push(0);
  return r;
}
/* a runner is put out without ending the plate appearance */
function runnerOut(i) {
  G.bases[i] = 0; G.outs++;
  if (G.outs >= 3) { G.b = 0; G.s = 0; return true; }
  return false;
}
/* at the release: apply the sign (user) or the CPU's plan; returns a short message for the hint line */
function startSigns(now) {
  steal = null; curBunt = false;
  let s = null;
  if (mode === 'bat') { s = sign; sign = null; }
  else { s = cpuStealPlan ? 'steal' : cpuBuntPlan ? 'bunt' : null; cpuStealPlan = cpuBuntPlan = false; }
  if (!s) return '';
  let msg = '';
  if (s === 'bunt' || s === 'squeeze') { curBunt = true; msg = mode === 'pit' ? 'バントの構え！' : ''; }
  if (s === 'steal' || s === 'run') {
    const run = stealers();
    if (run.length) {
      steal = { run, lead: run[0], t0: now, runEnd: now + 3.4, hitRun: s === 'run' };
      msg = s === 'run' ? 'エンドラン！' : run.length > 1 ? 'ダブルスチール！' : (mode === 'pit' ? '走った！速い球で刺そう' : '盗塁！');
    }
  }
  if (s === 'squeeze' && G.bases[2]) { steal = { run: [2], lead: 2, t0: now, runEnd: now + 3.0, squeeze: true }; msg = 'スクイズ！'; }
  return msg ? '　' + msg : '';
}
/* called when the pitch reaches the catcher; returns the outcome or null */
function settleSteal(c, now) {
  const s = steal; steal = null;
  if (!s) return null;
  if (c.kind !== 'take' && c.kind !== 'miss') return null;      // ball in play or foul: the play takes over
  if (s.squeeze) {                                             // missed squeeze: runner hung out at the plate
    const safe = Math.random() < 0.1;
    s.throw = null; s.arrive = now + 0.5; s.runEnd = now + 0.4;
    stealAnim = s; G.bases[2] = 0;
    let ended = false;
    if (safe) G.runs++; else { G.outs++; if (G.outs >= 3) { G.b = 0; G.s = 0; ended = true; } }
    let label = safe ? 'ホームイン！ 1点' : 'スクイズ失敗';
    if (ended) label = endInning(label);
    return { label, safe, ended, arrive: s.arrive };
  }
  let p = 0.62 + (128 - ball.speed) / 100 * 0.7 + TYPES[ball.key].hard * 0.08 - (s.run.length > 1 ? 0.05 : 0) - (s.hitRun ? 0.08 : 0);
  p = clamp(p, 0.3, 0.9);
  const safe = Math.random() < p, tgt = s.lead + 2;              // first -> 2B, second -> 3B
  const from = V(0, 1.2, 0.8), to = BASE_PT[tgt], t0 = now + 0.15, dur = from.distanceTo(to) / 33;
  s.throw = { from, to, t0, dur };
  s.arrive = t0 + dur; s.runEnd = s.arrive + (safe ? -0.25 : 0.35);
  stealAnim = s;
  const nb = G.bases.slice();
  s.run.forEach(i => { nb[i] = 0; if (i !== s.lead || safe) nb[i + 1] = 1; });
  G.bases = nb;
  let ended = false;
  if (!safe) { G.outs++; if (G.outs >= 3) { G.b = 0; G.s = 0; ended = true; } }
  let label = safe ? (s.run.length > 1 ? 'ダブルスチール成功！' : '盗塁成功！') : '盗塁失敗';
  if (ended) label = endInning(label);
  return { label, safe, ended, arrive: s.arrive };
}

/* ---- bunts ---- */
function buntContact(d, vy) {
  const q = 1 - Math.min(1, d / 0.9);
  if (q < 0.15) return { kind: 'miss', q };
  if (Math.abs(vy) > 0.45 && Math.random() < 0.5) return { kind: 'play', bunt: true, popup: true, q, dir: rnd(-20, 20), ev: 45, launch: 70, dist: rnd(6, 14), bases: 0, res: 'バント失敗' };
  if (Math.random() < 0.12 + 0.18 * (1 - q)) return { kind: 'foul', bunt: true, q, dir: (Math.random() < 0.5 ? -1 : 1) * rnd(50, 75), ev: 40, launch: 2, dist: rnd(5, 15) };
  return { kind: 'play', bunt: true, q, dir: rnd(-35, 35), ev: 40 + 20 * q, launch: 0, dist: rnd(9, 17), bases: 0, res: 'バント' };
}
/* returns { t: result text, good: good for the batting side, thr: bases the defense throws to } */
function buntResult(c, B, squeeze) {
  if (c.popup) return { t: out('バント失敗（小フライ）'), good: false };
  if (squeeze) {
    if (Math.random() < 0.15) { const t = advance(1, 'スクイズ成功！ 内野安打'); G.hits--; return { t, good: true }; }
    endPA(); G.outs++;
    G.bases = [0, B[0], B[1]]; G.runs++;
    return { t: 'スクイズ成功！ 1点', good: true, thr: [1] };
  }
  const r = Math.random();
  if (!(B[0] || B[1] || B[2])) {
    if (r < 0.3) return { t: advance(1, 'バントヒット'), good: true };
    return { t: out('バントアウト'), good: false, thr: [1] };
  }
  if (r < 0.12) return { t: advance(1, 'バントヒット'), good: true };
  const chain = B[0] ? (B[1] ? (B[2] ? 2 : 1) : 0) : -1;       // highest base in the forced chain
  if (r < 0.27 && chain >= 0) {                                 // lead forced runner is cut down
    endPA(); G.outs++;
    if (G.outs >= 3) return { t: endInning('バント失敗（封殺）'), good: false, thr: chain < 2 ? [chain + 2] : null };
    const nb = [1, 0, 0];
    for (let i = 0; i < 3; i++) { if (!B[i] || i === chain) continue; if (i < chain) nb[i + 1] = 1; else nb[i] = 1; }
    G.bases = nb;
    return { t: 'バント失敗（封殺）', good: false, thr: chain < 2 ? [chain + 2] : null };
  }
  endPA(); G.outs++;
  if (G.outs >= 3) return { t: endInning('送りバント'), good: false, thr: [1] };
  const sc = B[1] && B[2] ? 1 : 0;
  G.bases = [0, B[0], B[1] || B[2] ? 1 : 0]; G.runs += sc;
  return { t: '送りバント成功' + (sc ? ' 1点' : ''), good: true, thr: [1] };
}
function isBunting() {
  if (mode === 'bat' && phase === 'wait') return sign === 'bunt' || sign === 'squeeze';
  return curBunt && (phase === 'fly' || phase === 'result');
}
function buntGrip() {
  let C = V(0, ZY0 + 0.05, 0.05);
  if (mode === 'bat' && swing && swing.bunt) C = swing.C.clone();
  else if (mode === 'pit' && ball && ball.cpu && ball.cpu.buntC) C = ball.cpu.buntC.clone();
  const dir = V(1, 0.1, -0.08).normalize();
  const G0 = C.addScaledVector(dir, -0.42); G0.z = 0.05;
  return { G: G0, dir };
}

/* ---- pickoffs ---- */
function startPickoff(now, isOut) {
  const base = G.bases[0] ? 1 : 2;
  const from = squashJ(pitcherJ(0), MOUND_Y).hR.clone(), to = BASE_PT[base];
  pickoff = { base, from, to, t0: now + 0.2, dur: from.distanceTo(to) / 26, out: isOut, done: false };
  phase = 'pick'; setHint('牽制！');
}
function tryCpuPickoff(now) {
  if (online || mode !== 'bat' || !(G.bases[0] || G.bases[1])) return false;
  if (G.pickPa !== G.pa) { G.pickPa = G.pa; G.pickN = 0; }
  if (G.pickN >= 2 || Math.random() > (runSign() ? 0.3 : 0.15)) return false;
  G.pickN++;
  startPickoff(now, Math.random() < (sign === 'steal' || sign === 'run' ? 0.3 : 0.05));
  return true;
}
function userPickoff() {
  if (mode !== 'pit' || phase !== 'ready' || !(G.bases[0] || G.bases[1])) return;
  const planned = cpuStealPlan;
  startPickoff(now_(), Math.random() < (planned ? 0.4 : 0.07));
  if (planned && Math.random() < 0.5) cpuStealPlan = false;     // the runner gets scared off
}
function stepPickoff(now) {
  const pk = pickoff;
  if (!pk || pk.done || now < pk.t0 + pk.dur + 0.1) return;
  pk.done = true; sfx.pop();
  const good = mode === 'pit';                                  // a pickoff out is good news for the pitcher
  if (pk.out) {
    const ended = runnerOut(pk.base - 1);
    queueBanner(now, ended ? endInning('牽制アウト！') : '牽制アウト！', '', good ? 'g' : 'b', good ? 0.6 : 0);
    sign = null; cpuStealPlan = false;
  } else showBanner('牽制', 'セーフ', 'n');
  phase = 'result'; nextAt = now + 1.4;
}

/* ---- per-frame: running runners, the throw ball, and the follow camera ---- */
function updateRunning(now) {
  camShot = null;
  const s = (steal && phase === 'fly') ? steal : (stealAnim && pendBanner ? stealAnim : null);
  let th = null;
  if (s) {
    s.run.forEach(i => {
      const f = runnerF[i], [sx, sz] = RUNPOS[i], [tx, tz] = NEXT_BASE[i];
      const k = clamp((now - s.t0) / (s.runEnd - s.t0), 0, 1);
      const x = lerp(sx, tx, k), z = lerp(sz, tz, k), yaw = Math.atan2(tx - sx, tz - sz);
      f.g.visible = true;
      poseFig(f, squashJ(fielderJ(x, z, yaw, now * 12 + i, k < 1 ? 1 : 0, 0, 0), 0), yaw, yaw);
    });
    th = s.throw;
  }
  if (!th && pickoff) th = pickoff;
  throwMesh.visible = false;
  if (th && now < th.t0 + th.dur + 0.8) {                       // hold one wide shot of the throw and the runners
    if (!th.shot) th.shot = frameShot([th.from, th.to].concat(s ? s.run.map(i => V(RUNPOS[i][0], 0.5, RUNPOS[i][1])) : []), th.t0 - 0.1);
    camShot = th.shot;
  }
  if (th && now >= th.t0) {
    const k = clamp((now - th.t0) / th.dur, 0, 1);
    throwMesh.position.lerpVectors(th.from, th.to, k); throwMesh.position.y += 2.5 * k * (1 - k);
    throwMesh.visible = true;

}

/* ===== online 1-on-1 over Supabase Realtime =====
   The pitcher sends only what was thrown (type, speed, target). The batter's device plays the pitch, judges contact,
   and sends the contact result plus a random seed. Both devices run resolveCore() under that seed, so every random
   outcome (double plays, errors, where the ball lands) comes out the same and the game state stays identical. */
const SB_URL = 'https://qxtqaqcbhsekictbrdau.supabase.co';
const SB_KEY = 'sb_publishable_4TJm2e-nlqVN-yFZ_LvZhw_BzoXYkyD';
const PAGES_URL = 'https://saboten-apps.github.io/baseball/';
let online = false;

  score: { home: 0, away: 0 }, queued: null, waitRes: null, half: 1, joinTimer: 0 };

/* run fn with Math.random replaced by a seeded generator (mulberry32) */
function withSeed(seed, fn) {
  const R = Math.random;
  let a = seed >>> 0;
  Math.random = () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  try { return fn(); } finally { Math.random = R; }
}

const battingSide = () => (G.inning % 2 === 1 ? 'away' : 'home');   // top half: guest (pandas) bat, bottom: host (shibas)
function onlineScore() {
  const s = { home: onl.score.home, away: onl.score.away };
  if (G) s[battingSide()] += G.runs;                                // runs of the half in progress (banked at each change)
  return s;
}

}

  if (!p.hr && out.y < BALL_R) out.y = BALL_R;
  return out;
}

/* ===== per-frame update ===== */
const tmpV = V();
function pitcherK(now) {
  if (phase === 'wait') return clamp(1 - (nextAt - now) / 0.85, 0, 1);
  if (phase === 'deliver') return clamp((now - deliverStart) / DELIVER, 0, 1);
  if ((phase === 'fly' || phase === 'result') && ball) return 1 + clamp((now - ball.start) / 0.5, 0, 1) * 0.35;
  return 0;
}
function updateFielders(now, k) {
  const ready = phase === 'fly' || phase === 'deliver' || (phase === 'wait' && k > 0.6) ? 1 : 0.3;
  fielderF.forEach((f, i) => {
    let x = FPOS[i][0], z = FPOS[i][1], yaw = Math.atan2(-x, -z), mv = 0, reach = 0, rd = ready;
    if (play) {
      rd = 0.5;
      if (play.bi === i) {
        const u = (now - play.start - 0.12) / play.T;
        const pr = clamp(clamp(u, 0, 1) * play.fr + Math.max(0, u - 1) * 1.2, 0, 1);
        x = lerp(FPOS[i][0], play.L.x, pr); z = lerp(FPOS[i][1], play.L.z, pr);
        if (u > 0 && pr < 1) { mv = 1; yaw = Math.atan2(play.L.x - FPOS[i][0], play.L.z - FPOS[i][1]); }
        else yaw = Math.atan2(ballMesh.position.x - x, ballMesh.position.z - z);
        if (play.caught) reach = clamp((u - 0.7) / 0.3, 0, 1);
      } else if (play.cover && play.cover[i]) {
        const c = play.cover[i], k = clamp((now - play.start) / 1.0, 0, 1);
        x = lerp(FPOS[i][0], c.x - 0.6, k); z = lerp(FPOS[i][1], c.z + 0.6, k);
        if (k < 1) { mv = 1; yaw = Math.atan2(c.x - FPOS[i][0], c.z - FPOS[i][1]); }
        else yaw = Math.atan2(ballMesh.position.x - x, ballMesh.position.z - z);
      } else yaw = Math.atan2(ballMesh.position.x - x, ballMesh.position.z - z);
    }
    poseFig(f, squashJ(fielderJ(x, z, yaw, now * 11 + i * 1.7, mv, rd, reach), 0), yaw, yaw);
  });
}
/* runners on base run to the next base until the result is shown, then snap to the new bases */
const NEXT_BASE = [[0, -38.8], [-19.4, -19.4], [0, 0]];
function updateRunAnim(now) {
  if (!play || !play.run || !pendBanner) return;
  runnerF.forEach((f, i) => {
    if (!play.run[i]) return;
    const [sx, sz] = RUNPOS[i], [tx, tz] = NEXT_BASE[i];
    const d = Math.hypot(tx - sx, tz - sz), t0 = play.start + (play.tag ? play.T : 0.1);
    const k = clamp((now - t0) * 7.5 / d, 0, 1);
    const x = lerp(sx, tx, k), z = lerp(sz, tz, k), yaw = Math.atan2(tx - sx, tz - sz);
    f.g.visible = true;
    poseFig(f, squashJ(fielderJ(x, z, yaw, now * 12 + i, k > 0 && k < 1 ? 1 : 0, 0, 0), 0), yaw, yaw);
  });
}
function updateBall(now, dt, pj) {
  trail.forEach(m => { m.visible = false; });
  if (play) {
    const u = (now - play.start) / play.T;
    playBallPos(u, tmpV);
    ballMesh.position.copy(tmpV); ballMesh.visible = true;
    ballMesh.scale.setScalar(1 + 2.5 * clamp(u * 3, 0, 1));
    ballMesh.rotateX(dt * 25);
    if (u <= 1.02 && play.n < HT_N) {
      htGeo.attributes.position.setXYZ(play.n++, tmpV.x, tmpV.y, tmpV.z);
      htGeo.attributes.position.needsUpdate = true; htGeo.setDrawRange(0, play.n);
    }
    htLine.visible = play.n > 1;
    if (play.throws && u > 1) {
      const el = (u - 1) * play.T, n = play.throws.filter(t => el >= t.t0 + t.dur).length;
      if (n > play.thrN) { play.thrN = n; sfx.pop(); }
    }
    if (u >= 1 && !play.landed) {
      play.landed = true;
      if (!play.caught) { landRing.position.set(play.L.x, 0.06, play.L.z); landRing.visible = true; }
    }
    return;
  }
  htLine.visible = false; landRing.visible = false;
  if (ball) {
    const t = (now - ball.start) / ball.dur;
    ballPosAt(t, tmpV);
    ballMesh.position.copy(tmpV); ballMesh.scale.setScalar(1);
    ballMesh.visible = tmpV.z < 1.0;
    ballMesh.rotateOnAxis(ball.axis, ball.rps * dt);
    if (!ball.done && t < 1) {
      trailPts.push(tmpV.clone()); if (trailPts.length > trail.length) trailPts.shift();
      trailPts.forEach((p, i) => {
        const m = trail[i]; m.visible = true; m.position.copy(p);
        m.material.opacity = (i + 1) / trailPts.length * 0.22;
      });
    }
    return;
  }
  ballMesh.position.copy(pj.hR); ballMesh.scale.setScalar(1); ballMesh.visible = !(pickoff && phase === 'pick' && now >= pickoff.t0);
}
function pulse(m, t0, now, dur, s0, s1) {
  const u = (now - t0) / dur;
  if (u < 0 || u > 1) { m.visible = false; return; }
  m.visible = true; m.scale.setScalar(lerp(s0, s1, easeOut(u))); m.material.opacity = m.userData.op * (1 - u);
}
function updateFx(now) {
  pulse(tapRing, fxTap, now, 0.35, 0.06, 0.14);
  pulse(flashRing, fxFlash, now, 0.4, 0.08, 0.6);
  ghostRing.visible = ghostOn && !play; ghostRing.scale.setScalar(0.06);
  aimRing.visible = !!(flick && aim);
  if (aimRing.visible) { aimRing.position.set(aim.x, aim.y, 0.01); aimRing.scale.setScalar(0.08); }
  if (landRing.visible) landRing.scale.setScalar(1.4 + Math.sin(now * 6) * 0.2);
}
const _cl = V();
/* fixed shots instead of a chasing camera: pick one viewpoint that keeps every given point on screen, then hold it */
const shotCam = new THREE.PerspectiveCamera(50, 1, 0.1, 1200), _q = V();
function frameShot(pts, at) {
  let cx = 0, cy = 0, cz = 0;
  pts.forEach(p => { cx += p.x; cy += p.y; cz += p.z; });
  cx /= pts.length; cy /= pts.length; cz /= pts.length;
  let spread = 0;
  pts.forEach(p => { spread = Math.max(spread, Math.hypot(p.x - cx, p.z - cz)); });
  let hx = cx, hz = cz;
  const hl = Math.hypot(hx, hz);
  if (hl < 3) { hx = 0; hz = -1; } else { hx /= hl; hz /= hl; }
  const look = V(cx, Math.max(1, cy * 0.8), cz);
  const tall = clamp(1 - camera.aspect, 0, 0.6);                    // portrait screens: look down more steeply to use the height
  let pos, need, R = 14 + spread * 1.15, Hh = 6 + spread * (0.12 + tall * 0.9);   // stand behind the action, looking along it
  for (let tries = 0; tries < 4; tries++) {                         // back off until everything fits a sane lens
    pos = V(cx - hx * R, Hh, cz - hz * R);
    shotCam.aspect = camera.aspect; shotCam.position.copy(pos); shotCam.lookAt(look); shotCam.updateMatrixWorld();
    need = 0.2;
    pts.forEach(p => {
      _q.copy(p).applyMatrix4(shotCam.matrixWorldInverse);
      if (-_q.z < 1) return;
      need = Math.max(need, Math.abs(_q.y) / -_q.z, Math.abs(_q.x) / -_q.z / camera.aspect);
    });
    if (need * 1.15 < Math.tan(36 * D2R)) break;
    R *= 1.35; Hh *= 1.35;
  }
  const fov = clamp(2 * Math.atan(need * 1.15) / D2R, 34, 80);
  return { pos, look, fov, at };
}
function playShot(p, now) {
  const mid = V((p.S0.x + p.L.x) / 2, Math.max(p.S0.y, p.endY) + p.h, (p.S0.z + p.L.z) / 2);
  const pts = [p.S0, mid, V(p.L.x + p.roll.x, 0.5, p.L.z + p.roll.z)];
  if (p.throws) p.throws.forEach(t => pts.push(t.to));
  p.shot = frameShot(pts, now + 0.35);                             // let the swing finish in the catcher view, then cut
}
let camShot = null;
function updateCamera(now, dt) {
  let shot = null;
  if (play && play.shot && now >= play.shot.at) shot = play.shot;
  else if (camShot && now >= camShot.at) shot = camShot;
  if (shot) { camPos.copy(shot.pos); camLook.copy(shot.look); camFov = shot.fov; }
  else { camPos.copy(CAM_HOME); camLook.copy(homeLook()); camFov = homeFov; }
  camera.position.copy(camPos);
  if (!shot && now < shakeUntil) camera.position.add(V(rnd(-1, 1) * shakeAmp, rnd(-1, 1) * shakeAmp, 0));
  camera.lookAt(camLook);
  const near = shot ? 1 : 0.1;                                     // wide shots need depth precision far away
  if (Math.abs(camera.fov - camFov) > 0.01 || camera.near !== near) { camera.fov = camFov; camera.near = near; camera.updateProjectionMatrix(); }
}
function update(now, dt) {
  const k = pitcherK(now);
  const pj = squashJ(pitcherJ(k), MOUND_Y); poseFig(pitcherF, pj, 0, 0);
  const bj = batterJ(now, k); poseFig(batterF, squashJ(bj.J, 0, true), Math.PI / 2, Math.PI);
  batG.position.copy(bj.G); batG.quaternion.setFromUnitVectors(_Y, bj.dir);
  const gb = giantActive() && phase !== 'idle' ? 1 : 0;
  batG.scale.set(1 + gb * 1.6, 1 + gb * 0.55, 1 + gb * 1.6);
  updateFielders(now, k);
  updateRunAnim(now);
  updateRunning(now);
  refreshAct();
  updateBall(now, dt, pj);
  updateFx(now);
  updateCamera(now, dt);
}

/* ===== input ===== */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), zonePlane = new THREE.Plane(V(0, 0, 1), 0);
function screenToZone(px, py) {
  ndc.set(px / W * 2 - 1, -(py / H) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const p = V();
  return ray.ray.intersectPlane(zonePlane, p) ? p : null;
}
function pt(e) { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
function setAim(x, y) {
  const p = screenToZone(x, y); if (!p) return;
  p.x = clamp(p.x, -ZW * 2, ZW * 2); p.y = clamp(p.y, ZY0 - ZH * 2, ZY0 + ZH * 2);
  aim = p;
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); audioInit();
  const [x, y] = pt(e), now = now_();
  if (mode === 'bat') {
    if (phase === 'fly' && !swing && ball && !ball.done) {
      const p = screenToZone(x, y); if (!p) return;
      swing = { time: now, x: p.x / ZW, y: (ZY0 - p.y) / ZH, C: p, bunt: curBunt };
      if (!curBunt) { batAnim = { t0: now, plan: makeSwingPlan(p) }; sfx.swish(); }
      fxTap = now; tapRing.position.set(p.x, p.y, 0.01);
    }
  } else if (phase === 'ready') {
    flick = { pts: [[x, y, now * 1000]] }; setAim(x, y);
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  }
});
cv.addEventListener('pointermove', e => {
  if (!flick) return;
  const [x, y] = pt(e);
  flick.pts.push([x, y, now_() * 1000]); setAim(x, y);
  if (flick.pts.length > 160) flick.pts.shift();
  const g = readGesture(flick.pts);
  if (g) { setHint(TYPES[g].ico + '  ' + TYPES[g].name); markGuide(g); }
});
/* swipe direction -> pitch. angle 0 = right, 90 = up (screen). zigzag = knuckleball */
const GESTURE = [[90, 'str'], [45, 'cut'], [0, 'sli'], [-45, 'cur'], [-90, 'frk'], [-135, 'snk'], [180, 'sht'], [135, 'two']];
function readGesture(pts) {
  const a = pts[0], b = pts[pts.length - 1], dx = b[0] - a[0], dy = b[1] - a[1];
  let rev = 0, dir = 0, ext = a[0];
  for (const p of pts) {
    const x = p[0];
    if (dir === 0) { if (Math.abs(x - ext) > 14) { dir = Math.sign(x - ext); ext = x; } }
    else if ((x - ext) * dir > 0) ext = x;
    else if (Math.abs(x - ext) > 14) { rev++; dir = -dir; ext = x; }
  }
  if (rev >= 2) return 'knk';
  if (Math.hypot(dx, dy) < 30) return null;
  const ang = Math.atan2(-dy, dx) / D2R;
  let best = 'str', bd = 999;
  GESTURE.forEach(([c, k]) => { let d = Math.abs(ang - c); if (d > 180) d = 360 - d; if (d < bd) { bd = d; best = k; } });
  return best;
}
function markGuide(k) { [...$('#pitches').children].forEach(c => c.classList.toggle('on', c.dataset.t === k)); }
function endFlick(cancel) {
  if (!flick) return;
  const pts = flick.pts, last = pts[pts.length - 1], first = pts[0];
  flick = null;
  const a = aim; aim = null;
  if (cancel || !a) return;
  const tEnd = last[2];
  let i0 = pts.length - 1;
  while (i0 > 0 && tEnd - pts[i0 - 1][2] <= 100) i0--;
  if (i0 === pts.length - 1 && i0 > 0) i0--;   // always measure over at least the last segment
  const p0 = pts[i0], dtm = Math.max(16, tEnd - p0[2]);
  const v = Math.hypot(last[0] - p0[0], last[1] - p0[1]) / dtm;
  const total = Math.hypot(last[0] - first[0], last[1] - first[1]);
  let key = readGesture(pts);
  if (!key || total < 40 || v < 0.2) { setHint('もっと大きく、素早く弾いて投げる'); return; }
  let f = clamp(v * 28 / 65, 0, 1);
  if (key === 'str' && f < 0.3) { key = 'chg'; f = f / 0.3; }   // a slow fastball swipe throws a changeup
  else if (key === 'str' && f > 0.85) { key = 'gou'; f = (f - 0.85) / 0.15; }   // a very fast one throws the heater
  ptype = key; markGuide(key);
  const T = TYPES[key];
  const P = curPitcher();
  const sig = (0.06 + f * 0.22) * (1 + (3 - P.c) * 0.15) + P.fatigue * 0.25;
  const tx = a.x / ZW + gauss() * sig, ty = (ZY0 - a.y) / ZH + gauss() * sig;
  pending = { key, speed: clamp(T.min + (T.max - T.min) * f + (P.v - 3) * 4 - P.fatigue * 8, 70, 170), tx: clamp(tx, -2, 2), ty: clamp(ty, -2, 2) };
  phase = 'deliver'; deliverStart = now_(); setHint(T.ico + '  ' + T.name);
  if (online) send('pitch', { p: pending });
}
cv.addEventListener('pointerup', () => endFlick(false));
cv.addEventListener('pointercancel', () => endFlick(true));

/* ===== flow ===== */
function startGame() {
  audioInit(); newGame();
  $('#overlay').hidden = true;
  phase = mode === 'bat' ? 'wait' : 'ready';
  nextAt = now_() + 1.8;
  setHint(mode === 'bat' ? '投手が投げたら、ボールが通る位置をタップして打つ' : '弾く向きで球種が決まる。指を離した位置がコース、弾く速さが球速');
  updateGoal();
}
function setMode(m) {
  mode = m; flick = null; aim = null; pending = null;
  $('#mBat').classList.toggle('on', m === 'bat');
  $('#mPit').classList.toggle('on', m === 'pit');
  $('#pitches').hidden = m !== 'pit';
  setTeams(); newGame(); showStart(); resize();
}
function buildPitchButtons() {
  const pc = $('#pitches'); pc.innerHTML = '';
  ['gou', 'str', 'cut', 'sli', 'cur', 'frk', 'snk', 'sht', 'two', 'chg', 'knk'].forEach(k => {
    const b = document.createElement('div');
    b.className = 'pg';
    b.dataset.t = k;
    b.innerHTML = '<i' + (TYPES[k].ico.length > 1 ? ' style="font-size:10px"' : '') + '>' + TYPES[k].ico + '</i><b>' + TYPES[k].short + '</b>';
    pc.appendChild(b);
  });
}
$('#goBtn').addEventListener('click', () => { audioInit(); if (ovAction) ovAction(); });
$('#go2').addEventListener('click', () => { audioInit(); if (ovAction2) ovAction2(); });
$('#go3').addEventListener('click', () => { audioInit(); if (ovAction3) ovAction3(); });
$('#codeIn').addEventListener('keydown', e => { if (e.key === 'Enter' && ovAction) ovAction(); });
$('#menuBtn').addEventListener('click', showMenu);
$('#cmtBtn').addEventListener('click', () => setCmtMode((cmt.mode + 1) % 3));
$('#cmtBtn').textContent = CMT_LABEL[cmt.mode];
if (window.speechSynthesis) speechSynthesis.onvoiceschanged = () => { cmt.voice = null; };
$('#mBat').addEventListener('click', () => setMode('bat'));
$('#mPit').addEventListener('click', () => setMode('pit'));
$('#pitches').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  ptype = b.dataset.t;
  [...$('#pitches').children].forEach(c => c.classList.toggle('on', c === b));
});

let lastT = now_(), perfN = 0, perfSum = 0, degraded = LITE;
function frame() {
  const now = now_(), rawDt = now - lastT, dt = Math.min(0.05, rawDt); lastT = now;
  if (!degraded && !document.hidden && rawDt < 0.5) {
    perfN++; perfSum += rawDt;
    if (perfN >= 90) {
      if (perfSum / perfN > 0.034) { degraded = true; renderer.setPixelRatio(1); key.castShadow = false; resize(); }
      perfN = 0; perfSum = 0;
    }
  }
  if (phase === 'wait' && now >= nextAt) { if (!tryCpuPickoff(now)) cpuPitch(); }
  else if (phase === 'pick') stepPickoff(now);
  else if (phase === 'deliver' && now >= deliverStart + DELIVER) { const p = pending; pending = null; launchBall(p); }
  else if (phase === 'fly' && ball) stepFly(now);
  else if (phase === 'result' && now >= nextAt) afterResult();
  if (pendBanner && now >= pendBanner.at) flushBanner();
  update(now, dt);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
if (window.ResizeObserver) new ResizeObserver(resize).observe($('#stage'));
window.addEventListener('resize', resize);
buildPitchButtons(); setTeams(); resize(); newGame(); showMenu();
requestAnimationFrame(frame);
})();

</script>
